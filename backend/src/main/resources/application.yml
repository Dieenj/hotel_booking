spring:
  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Services own their transactions; no lazy loading while rendering responses.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Load lazy associations/collections in batches instead of one query per row (N+1).
        default_batch_fetch_size: 50

  flyway:
    # A database created before Flyway (by ddl-auto: update) has the V1 schema but no history
    # table: record it as V1 instead of failing. New, empty databases run V1 normally.
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000       # 24 hours in ms
    refresh-expiration: 604800000  # 7 days in ms
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  booking:
    pending-ttl: ${BOOKING_PENDING_TTL:30m}   # unpaid bookings are cancelled after this
    expiry-check-interval-ms: 60000
    completion-cron: "0 5 * * * *"           # hourly: mark finished stays COMPLETED
  scheduling:
    enabled: true
  security:
    login:
      max-attempts: 5      # failed logins per email before a lockout
      lockout: 15m

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
