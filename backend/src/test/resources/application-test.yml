# Tests run on in-memory H2 by default. Set TEST_DB_URL (plus TEST_DB_USERNAME/TEST_DB_PASSWORD)
# to run the same suite against PostgreSQL, as CI does — some bugs only show up there.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
  jpa:
    # Same as the documented local/production config: no lazy loading outside transactions.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true
  mail:
    host: localhost
    port: 25

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

app:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-testing
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:5173
  scheduling:
    enabled: false
